
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1>STUDENT INFORMATION SYSTEM</h1>
    <h2>Student Registration Form</h2>

    <p>Please fill in the following details to register.</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label>Full Name:</label>
            <input type="text" name="name"
                   placeholder="Enter your name" required>
            <br><br>

            <label>Email:</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>

            <label>Password:</label>
            <input type="password" name="password"
                   minlength="6" required>
            <br><br>

            <label>Age:</label>
            <input type="number" name="age"
                   min="16" max="60" required>
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob" required>
            <br><br>

            <label>Gender:</label>
            <br>

            <input type="radio" name="gender"
                   value="Male" required> Male

            <input type="radio" name="gender"
                   value="Female"> Female

            <input type="radio" name="gender"
                   value="Other"> Other

        </fieldset>

        <br>

        <!-- Academic Information -->
        <fieldset>
            <legend>Academic Information</legend>

            <label>Department:</label>

            <select name="department" required>
                <option value="">Select Department</option>
                <option>Computer Science</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Commerce</option>
            </select>

            <br><br>

            <label>Semester:</label>

            <select name="semester" required>
                <option value="">Select Semester</option>
                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
            </select>

            <br><br>

            <label>Interested Subjects:</label>
            <br>

            <input type="checkbox" name="subject"
                   value="HTML"> HTML

            <input type="checkbox" name="subject"
                   value="Programming"> Programming

            <input type="checkbox" name="subject"
                   value="Mathematics"> Mathematics

            <input type="checkbox" name="subject"
                   value="Electronics"> Electronics

        </fieldset>

        <br>

        <!-- Additional Details -->
        <fieldset>
            <legend>Additional Details</legend>

            <label>Upload Student Photo:</label>
            <input type="file" name="photo"
                   accept="image/*">
            <br><br>

            <label>Address / Comments:</label>
            <br>

            <textarea name="comments" rows="5" cols="40"
                      placeholder="Enter your address or comments"
                      required></textarea>

        </fieldset>

        <br>

        <!-- Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
